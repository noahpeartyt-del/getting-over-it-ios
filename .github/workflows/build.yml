name: Build iOS IPA (Capacitor)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Web Directory
        run: |
          # Capacitor requires game files to live inside a 'www' folder
          mkdir -p www
          
          # Safely move your Scratch files into the www directory, ignoring system folders
          rsync -av --exclude='www' --exclude='.github' --exclude='.git' ./ www/

      - name: Install and Initialize Capacitor
        run: |
          # Initialize package.json and install core packages
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          
          # Configure Capacitor to look for your web asset folder
          npx cap init "GettingOverIt" "com.scratch.gettingoverit" --web-dir=www

      - name: Add iOS Platform
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build iOS Application Archive
        run: |
          cd ios/App
          
          # Compile the project as a clean, unsigned simulator bundle using native Xcode command lines
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_ING_REQUIRED=NO \
                     clean build

      - name: Package App Package Into IPA
        run: |
          # Structure the App folder exactly into the IPA container format Sideloadly expects
          mkdir -p Payload
          cp -r ios/App/DerivedData/App/Build/Products/Debug-iphonesimulator/App.app Payload/ 2>/dev/null || cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Debug-iphonesimulator/App.app Payload/
          zip -r GettingOverIt.ipa Payload/

      - name: Archive IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: GettingOverIt.ipa
