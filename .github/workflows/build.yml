name: Build iOS IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          # Create project and clean the default app folder
          cordova create myapp com.scratch.gettingoverit "GettingOverIt"
          rm -rf myapp/www/*
          
          # Safely copy files, avoiding copying the myapp folder into itself
          rsync -av --exclude='myapp' --exclude='.github' --exclude='.git' ./ myapp/www/
          
          cd myapp
          cordova platform add ios
          
          # Run the build. If it fails, this line stops and shows the exact logs
          cordova build ios --device --NO_SIGN --verbose
          
          # Manually pack the compiled app folder into an IPA file
          mkdir -p Payload
          cp -r platforms/ios/build/device/GettingOverIt.app Payload/ || cp -r platforms/ios/build/emulator/GettingOverIt.app Payload/
          zip -r GettingOverIt.ipa Payload/

      - name: Archive IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: myapp/GettingOverIt.ipa
