nname: Build iOS IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myapp com.scratch.gettingoverit "GettingOverIt"
          rm -rf myapp/www/*
          rsync -av --exclude='myapp' --exclude='.github' --exclude='.git' ./ myapp/www/
          
          cd myapp
          cordova platform add ios
          
          # Force an emulator build to skip Apple's forced signing locks
          cordova build ios --emulator --NO_SIGN
          
          # Manually package the generated simulator application folder into a raw .ipa file
          mkdir -p Payload
          cp -r platforms/ios/build/emulator/GettingOverIt.app Payload/
          zip -r GettingOverIt.ipa Payload/

      - name: Archive IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: myapp/GettingOverIt.ipa
